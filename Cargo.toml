[package]
name = "rseq-rs"
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/botirkhaltaev/rseq-rs"
description = "Safe Linux restartable-sequence primitives"
readme = "README.md"
rust-version = "1.96"
publish = false
autobenches = false

[lib]
name = "rseq_rs"

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.bench]
debug = "line-tables-only"
lto = "fat"
codegen-units = 1

[dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "counter"
harness = false

[[bench]]
name = "cached"
harness = false

[[bench]]
name = "freelist"
harness = false

[[bench]]
name = "drain"
harness = false
